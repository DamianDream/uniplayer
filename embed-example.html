<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniplayer: пример встраивания</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
  pre { background: #f2f2f2; padding: 10px; height: 160px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>Пример встраивания</h1>

<!-- Props передаются в адресе iframe. Замените src= на своё видео. -->
<iframe id="player"
        src="index.html?src=https%3A%2F%2Ftest-streams.mux.dev%2Fx36xhzz%2Fx36xhzz.m3u8&title=Demo"
        allow="autoplay; fullscreen"></iframe>

<p>
  <button data-cmd="play">play</button>
  <button data-cmd="pause">pause</button>
  <button data-cmd="seek" data-value="60">seek 60</button>
  <button data-cmd="mute">mute</button>
  <button data-cmd="volume" data-value="0.5">volume 0.5</button>
</p>
<pre id="log"></pre>

<script>
  var frame = document.getElementById("player"), log = document.getElementById("log");

  // Команды плееру
  document.querySelectorAll("button").forEach(function (b) {
    b.onclick = function () {
      var msg = { target: "uniplayer", command: b.dataset.cmd };
      if (b.dataset.value) msg.value = +b.dataset.value;
      frame.contentWindow.postMessage(msg, "*");
    };
  });

  // События от плеера
  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow || !e.data || e.data.source !== "uniplayer") return;
    log.textContent = JSON.stringify(e.data) + "\n" + log.textContent;
  });
</script>
</body>
</html>
