<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Відеоплеєр</title>
<style>
  :root {
    --accent: #ff5a36;
    --bg: #000;
    --ctrl-bg: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0));
    --text: #fff;
    --muted: rgba(255,255,255,.65);
    --track: rgba(255,255,255,.25);
    --buffer: rgba(255,255,255,.45);
    --menu-bg: rgba(20,20,20,.96);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .player { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden;
    border-radius: var(--radius); user-select: none; -webkit-tap-highlight-color: transparent; }
  body.embed .player { border-radius: 0; }
  video { width: 100%; height: 100%; display: block; background: #000; object-fit: contain; }

  .big-play { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%;
    border: 0; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.4); transition: transform .15s ease, opacity .2s ease; }
  .big-play:hover { transform: scale(1.06); }
  .big-play svg { width: 36px; height: 36px; margin-left: 4px; }
  .player.started .big-play { opacity: 0; pointer-events: none; }

  .spinner { position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite;
    display: none; pointer-events: none; }
  .player.waiting .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 10px; background: var(--ctrl-bg);
    transition: opacity .25s ease; }
  .player.started.idle:not(.paused) .controls { opacity: 0; pointer-events: none; }
  .player.started.idle:not(.paused) { cursor: none; }
  .player:not(.started) .controls { opacity: 0; pointer-events: none; }

  .seek { position: relative; height: 18px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .seek .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden;
    transition: height .12s ease; }
  .seek:hover .track, .seek.dragging .track { height: 6px; }
  .seek .buffered, .seek .played { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
  .seek .buffered { background: var(--buffer); }
  .seek .played { background: var(--accent); }
  .seek .thumb { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
    transform: translateX(-50%) scale(0); transition: transform .12s ease; left: 0; }
  .seek:hover .thumb, .seek.dragging .thumb { transform: translateX(-50%) scale(1); }
  .seek .hover-time { position: absolute; bottom: 22px; transform: translateX(-50%); background: var(--menu-bg);
    padding: 3px 7px; border-radius: 6px; font-size: 12px; font-variant-numeric: tabular-nums; display: none; white-space: nowrap; }
  .seek:hover .hover-time, .seek.dragging .hover-time { display: block; }

  .bar { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .btn { background: none; border: 0; color: var(--text); width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; padding: 0; font: inherit; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn:focus-visible, .big-play:focus-visible, .menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 24px; height: 24px; }
  .btn.text { width: auto; padding: 0 10px; font-weight: 600; font-size: 13px; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); margin: 0 6px; white-space: nowrap; }
  .time b { color: var(--text); font-weight: 500; }
  .spacer { flex: 1; }

  .volume { display: flex; align-items: center; }
  .volume input { width: 0; opacity: 0; transition: width .2s ease, opacity .2s ease; accent-color: var(--accent); }
  .volume:hover input, .volume input:focus { width: 80px; opacity: 1; margin-right: 6px; }

  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; bottom: 46px; min-width: 150px; background: var(--menu-bg); border-radius: 10px;
    padding: 6px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .menu.open { display: block; }
  .menu h4 { margin: 4px 10px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .menu button { display: flex; width: 100%; justify-content: space-between; gap: 16px; background: none; border: 0; color: var(--text);
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; text-align: left; }
  .menu button:hover { background: rgba(255,255,255,.1); }
  .menu button[aria-checked="true"]::after { content: "✓"; color: var(--accent); }
  .menu .note { color: var(--muted); font-size: 12px; }

  .toast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: var(--menu-bg);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
  .toast.show { opacity: 1; }
  .error { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: rgba(0,0,0,.85); }
  .player.failed .error { display: grid; }

  @media (max-width: 560px) {
    .controls { padding: 22px 8px 6px; }
    .btn { width: 36px; height: 36px; }
    .volume input { display: none; }
    .time { font-size: 12px; margin: 0 2px; }
    .big-play { width: 68px; height: 68px; }
  }
</style>
</head>
<body>
<div class="player paused" id="player" tabindex="-1">
  <video id="video" playsinline preload="metadata"></video>

  <button class="big-play" id="bigPlay" aria-label="Відтворити">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="spinner" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="error" id="error"><div id="errorText"><b>Не вдалося завантажити відео.</b><br><span class="note">Перевірте з'єднання та оновіть сторінку.</span></div></div>

  <div class="controls" id="controls">
    <div class="seek" id="seek" role="slider" aria-label="Перемотування" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="track"><div class="buffered" id="buffered"></div><div class="played" id="played"></div></div>
      <div class="thumb" id="thumb"></div>
      <div class="hover-time" id="hoverTime">0:00</div>
    </div>
    <div class="bar">
      <button class="btn" id="playBtn" aria-label="Відтворити">
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="btn" id="back10" aria-label="Назад на 10 секунд">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui" font-weight="700">10</text></svg>
      </button>
      <button class="btn" id="fwd10" aria-label="Вперед на 10 секунд">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui" font-weight="700">10</text></svg>
      </button>
      <div class="volume">
        <button class="btn" id="muteBtn" aria-label="Вимкнути звук">
          <svg class="i-vol" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <svg class="i-mute" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Гучність">
      </div>
      <span class="time"><b id="cur">0:00</b> / <span id="dur">0:00</span></span>
      <span class="spacer"></span>
      <div class="menu-wrap">
        <button class="btn text" id="speedBtn" aria-haspopup="true" aria-expanded="false" aria-label="Швидкість">1×</button>
        <div class="menu" id="speedMenu" role="menu"><h4>Швидкість</h4></div>
      </div>
      <div class="menu-wrap" id="qualityWrap">
        <button class="btn" id="qualityBtn" aria-haspopup="true" aria-expanded="false" aria-label="Якість">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="menu" id="qualityMenu" role="menu"><h4>Якість</h4></div>
      </div>
      <button class="btn" id="fsBtn" aria-label="На весь екран">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script>
(function () {
  // ---- Відео з адреси сторінки ----
  //   ?v=amm/urok-zakritij-kanal                          папка відео на CDN
  //   ?v=https://cdn.astakhova.com.ua/amm/.../master.m3u8   або повне посилання
  //   &t=1:30  (або 90, 1m30s)  почати з потрібного моменту
  //   &poster=https://...       інша обкладинка
  //   &embed=1                  без заокруглень, для iframe
  var CDN = "https://cdn.astakhova.com.ua";
  var ALLOWED_HOSTS = ["cdn.astakhova.com.ua"];   // з яких доменів плеєр погоджується грати відео

  var params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.body.classList.add("embed");

  var $ = function (id) { return document.getElementById(id); };
  var player = $("player"), video = $("video");
  var SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
  var hls = null;

  function resolveSrc(raw) {
    if (!raw) return null;
    raw = raw.trim();
    var url;
    try {
      if (/^https?:\/\//i.test(raw) || raw.charAt(0) === "/") url = new URL(raw, CDN);
      else {
        var path = raw.replace(/^\/+|\/+$/g, "");
        if (!/^[\w.\-\/]+$/.test(path) || path.indexOf("..") !== -1) return null;
        url = new URL(CDN + "/" + path + (/\.m3u8$/i.test(path) ? "" : "/master.m3u8"));
      }
    } catch (e) { return null; }
    if (ALLOWED_HOSTS.indexOf(url.hostname) === -1) return null;
    if (url.protocol !== "https:" && url.hostname !== "localhost") return null;
    if (!/\.m3u8$/i.test(url.pathname)) url.pathname = url.pathname.replace(/\/?$/, "/master.m3u8");
    return url.href;
  }
  function parseTime(s) {
    if (!s) return NaN;
    if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
    var m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
    if (m && m[0]) return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
    var p = s.split(":").map(Number);
    if (p.every(function (n) { return isFinite(n); })) return p.reduce(function (a, n) { return a * 60 + n; }, 0);
    return NaN;
  }

  var src = resolveSrc(params.get("v") || params.get("src"));
  var startAt = parseTime(params.get("t"));
  if (!src) {
    $("errorText").innerHTML = params.get("v") || params.get("src")
      ? "<b>Це посилання на відео не підтримується.</b><br><span class=\"note\">Відео має бути на " + CDN.replace("https://", "") + ".</span>"
      : "<b>Відео не вказано.</b><br><span class=\"note\">Додайте до адреси <code>?v=папка/відео</code>, наприклад <code>?v=amm/urok-zakritij-kanal</code>.</span>";
    player.classList.add("failed", "started");
    return;
  }
  var poster = params.get("poster") || src.replace(/[^\/]+\.m3u8(\?.*)?$/, "poster.jpg");
  var storeKey = "vp-pos:" + src.split("?")[0];
  var folder = src.replace(/\/[^\/]+\.m3u8.*$/, "").split("/").pop();
  if (folder) document.title = folder.replace(/[-_]+/g, " ");

  video.poster = poster;

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60);
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1400);
  }

  // ---- Підключення джерела ----
  var nativeHls = video.canPlayType("application/vnd.apple.mpegurl");
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ capLevelToPlayerSize: true, startLevel: -1, maxBufferLength: 30 });
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, buildQualityMenu);
    hls.on(Hls.Events.LEVEL_SWITCHED, updateQualityLabel);
    var recovered = 0;
    hls.on(Hls.Events.ERROR, function (_, d) {
      if (!d.fatal) return;
      if (recovered++ > 3) { player.classList.add("failed"); hls.destroy(); return; }
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else { player.classList.add("failed"); hls.destroy(); }
    });
  } else if (nativeHls) {
    video.src = src;               // Safari / iOS: нативний HLS, якість обирається автоматично
    $("qualityWrap").style.display = "none";
    video.addEventListener("error", function () { player.classList.add("failed"); });
  } else {
    player.classList.add("failed");
  }

  // ---- Відновлення позиції перегляду ----
  video.addEventListener("loadedmetadata", function () {
    var saved = parseFloat(load(storeKey));
    if (startAt >= 0 && startAt < video.duration) { video.currentTime = startAt; }
    else if (saved > 5 && saved < video.duration - 10) { video.currentTime = saved; toast("Продовжуємо з " + fmt(saved)); }
    $("dur").textContent = fmt(video.duration);
  });
  var lastSave = 0;
  video.addEventListener("timeupdate", function () {
    var now = Date.now();
    if (now - lastSave > 5000) { lastSave = now; store(storeKey, video.currentTime.toFixed(1)); }
  });
  video.addEventListener("ended", function () { store(storeKey, null); });

  // ---- Відтворення ----
  function togglePlay() { video.paused || video.ended ? video.play() : video.pause(); }
  $("bigPlay").onclick = togglePlay;
  $("playBtn").onclick = togglePlay;
  video.addEventListener("click", togglePlay);
  video.addEventListener("play", function () {
    player.classList.add("started"); player.classList.remove("paused");
    $("playBtn").querySelector(".i-play").style.display = "none";
    $("playBtn").querySelector(".i-pause").style.display = "";
    $("playBtn").setAttribute("aria-label", "Пауза");
  });
  video.addEventListener("pause", function () {
    player.classList.add("paused");
    $("playBtn").querySelector(".i-play").style.display = "";
    $("playBtn").querySelector(".i-pause").style.display = "none";
    $("playBtn").setAttribute("aria-label", "Відтворити");
    store(storeKey, video.currentTime.toFixed(1));
  });
  video.addEventListener("waiting", function () { player.classList.add("waiting"); });
  ["playing", "canplay", "seeked"].forEach(function (e) {
    video.addEventListener(e, function () { player.classList.remove("waiting"); });
  });
  function skip(d) { video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + d)); toast((d > 0 ? "+" : "−") + Math.abs(d) + " с"); }
  $("back10").onclick = function () { skip(-10); };
  $("fwd10").onclick = function () { skip(10); };

  // ---- Прогрес і перемотування ----
  var seek = $("seek"), dragging = false;
  function pct(t) { return video.duration ? (t / video.duration) * 100 : 0; }
  function paint() {
    var p = pct(video.currentTime);
    $("played").style.width = p + "%"; $("thumb").style.left = p + "%";
    $("cur").textContent = fmt(video.currentTime);
    seek.setAttribute("aria-valuenow", Math.round(p));
    seek.setAttribute("aria-valuetext", fmt(video.currentTime) + " з " + fmt(video.duration));
    var b = video.buffered, end = 0;
    for (var i = 0; i < b.length; i++) if (b.start(i) <= video.currentTime + 0.5) end = Math.max(end, b.end(i));
    $("buffered").style.width = pct(end) + "%";
  }
  video.addEventListener("timeupdate", paint);
  video.addEventListener("progress", paint);
  function posToTime(x) {
    var r = seek.getBoundingClientRect();
    return Math.max(0, Math.min(1, (x - r.left) / r.width)) * (video.duration || 0);
  }
  seek.addEventListener("pointermove", function (e) {
    var r = seek.getBoundingClientRect(), t = posToTime(e.clientX);
    var ht = $("hoverTime"); ht.textContent = fmt(t);
    ht.style.left = Math.max(24, Math.min(r.width - 24, e.clientX - r.left)) + "px";
    if (dragging) { video.currentTime = t; paint(); }
  });
  seek.addEventListener("pointerdown", function (e) {
    dragging = true; seek.classList.add("dragging"); seek.setPointerCapture(e.pointerId);
    video.currentTime = posToTime(e.clientX); paint();
  });
  seek.addEventListener("pointerup", function () { dragging = false; seek.classList.remove("dragging"); });
  seek.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { skip(-5); e.preventDefault(); }
    if (e.key === "ArrowRight") { skip(5); e.preventDefault(); }
  });

  // ---- Гучність ----
  var vol = $("volume");
  var savedVol = parseFloat(load("vp-volume"));
  if (savedVol >= 0 && savedVol <= 1) { video.volume = savedVol; vol.value = savedVol; }
  vol.oninput = function () { video.volume = +vol.value; video.muted = +vol.value === 0; store("vp-volume", vol.value); };
  $("muteBtn").onclick = function () { video.muted = !video.muted; };
  video.addEventListener("volumechange", function () {
    var m = video.muted || video.volume === 0;
    $("muteBtn").querySelector(".i-vol").style.display = m ? "none" : "";
    $("muteBtn").querySelector(".i-mute").style.display = m ? "" : "none";
    $("muteBtn").setAttribute("aria-label", m ? "Увімкнути звук" : "Вимкнути звук");
    vol.value = video.muted ? 0 : video.volume;
  });

  // ---- Меню ----
  function closeMenus(except) {
    document.querySelectorAll(".menu").forEach(function (m) {
      if (m !== except) { m.classList.remove("open"); m.previousElementSibling.setAttribute("aria-expanded", "false"); }
    });
  }
  function bindMenu(btn, menu) {
    btn.onclick = function (e) {
      e.stopPropagation(); closeMenus(menu);
      var open = menu.classList.toggle("open"); btn.setAttribute("aria-expanded", String(open));
    };
  }
  document.addEventListener("click", function () { closeMenus(); });
  function addItem(menu, label, checked, onPick) {
    var b = document.createElement("button");
    b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", String(checked)); b.textContent = label;
    b.onclick = function (e) {
      e.stopPropagation();
      menu.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-checked", "false"); });
      b.setAttribute("aria-checked", "true"); onPick(); closeMenus();
    };
    menu.appendChild(b); return b;
  }

  // Швидкість
  var speedMenu = $("speedMenu");
  SPEEDS.forEach(function (s) {
    addItem(speedMenu, s === 1 ? "Звичайна" : s + "×", s === 1, function () {
      video.playbackRate = s; $("speedBtn").textContent = s + "×"; toast("Швидкість " + s + "×");
    });
  });
  bindMenu($("speedBtn"), speedMenu);

  // Якість
  var qualityMenu = $("qualityMenu"), autoItem = null;
  function buildQualityMenu() {
    qualityMenu.querySelectorAll("button, .note").forEach(function (n) { n.remove(); });
    autoItem = addItem(qualityMenu, "Авто", true, function () { hls.currentLevel = -1; toast("Якість: авто"); });
    hls.levels
      .map(function (l, i) { return { h: l.height, i: i }; })
      .sort(function (a, b) { return b.h - a.h; })
      .forEach(function (l) {
        addItem(qualityMenu, l.h + "p", false, function () { hls.currentLevel = l.i; toast("Якість " + l.h + "p"); });
      });
    var note = document.createElement("div"); note.className = "note"; note.style.padding = "4px 10px"; note.id = "qNow";
    qualityMenu.appendChild(note);
  }
  function updateQualityLabel(_, d) {
    var n = $("qNow"), l = hls.levels[d.level];
    if (n && l) n.textContent = "Зараз: " + l.height + "p";
  }
  bindMenu($("qualityBtn"), qualityMenu);

  // ---- Повний екран ----
  $("fsBtn").onclick = function () {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (player.requestFullscreen) { player.requestFullscreen(); }
    else if (player.webkitRequestFullscreen) { player.webkitRequestFullscreen(); }
    else if (video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); }   // iPhone
  };
  video.addEventListener("dblclick", function () { $("fsBtn").click(); });

  // ---- Автоприховування панелі ----
  var idleTimer;
  function wake() {
    player.classList.remove("idle"); clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { if (!video.paused) player.classList.add("idle"); }, 2500);
  }
  ["pointermove", "pointerdown", "keydown", "touchstart"].forEach(function (e) { player.addEventListener(e, wake, { passive: true }); });

  // ---- Клавіші ----
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    switch (e.key) {
      case " ": case "k": togglePlay(); e.preventDefault(); break;
      case "ArrowLeft": if (e.target !== seek) { skip(-10); e.preventDefault(); } break;
      case "ArrowRight": if (e.target !== seek) { skip(10); e.preventDefault(); } break;
      case "f": $("fsBtn").click(); break;
      case "m": video.muted = !video.muted; break;
    }
  });
})();
</script>
</body>
</html>
